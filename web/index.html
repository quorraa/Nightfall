<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05060f">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nightfall">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Nightfall</title>
  <link rel="stylesheet" href="style.css">
  <link rel="modulepreload" href="vendor/three.module.min.js">
</head>
<body data-mode="idle">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <header class="top">
    <span class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.2a8.6 8.6 0 1 0 5.3 13.9A7.2 7.2 0 0 1 15.5 3.2z"/></svg>
      Nightfall
    </span>
    <span class="host" id="host" data-state="connecting"><i></i><span id="hostName">Connecting…</span></span>
  </header>

  <main class="hero">
    <p class="clock" id="clock" aria-live="off">--:--</p>
    <p class="line" id="line">Let the screens sleep.</p>
  </main>

  <section class="panel" id="panel">
    <div class="view view-idle">
      <div class="when" role="radiogroup" aria-label="When the screens go dark">
        <button role="radio" aria-checked="true" data-delay="0">Now</button>
        <button role="radio" aria-checked="false" data-delay="300">5 min</button>
        <button role="radio" aria-checked="false" data-delay="900">15 min</button>
        <button role="radio" aria-checked="false" data-delay="1800">30 min</button>
        <button role="radio" aria-checked="false" data-delay="3600">1 hr</button>
      </div>

      <div class="slider" id="slider">
        <div class="slider-fill"></div>
        <span class="slider-label" id="sliderLabel">Slide to turn off the screens</span>
        <button class="knob" id="knob" aria-describedby="sliderLabel" aria-label="Turn off the screens">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.2a8.6 8.6 0 1 0 5.3 13.9A7.2 7.2 0 0 1 15.5 3.2z"/></svg>
        </button>
      </div>

      <div class="foot">
        <button class="text-btn" data-action="wake">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M5.3 18.7l1.5-1.5M17.2 6.8l1.5-1.5"/></svg>
          Wake screens
        </button>
        <p class="message" id="message" role="status"></p>
      </div>
    </div>

    <div class="view view-pending">
      <p class="pending-label">Screens turn off in</p>
      <p class="countdown" id="countdown">--:--</p>
      <div class="row">
        <button class="btn ghost" data-action="cancel">Cancel</button>
        <button class="btn pearl" data-action="now">Turn off now</button>
      </div>
    </div>

    <div class="view view-night">
      <p class="goodnight">Goodnight.</p>
      <p class="sub" id="nightSub">The screens are off.</p>
      <div class="row">
        <button class="btn ghost" data-action="wake">Wake screens</button>
        <button class="btn ghost" data-action="done">Done</button>
      </div>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
