[package]
name = "nightfall"
version = "2.0.0"
edition = "2021"
description = "Turn a Windows PC's monitors off from your phone"
license = "MIT"
build = "build.rs"

# No dependencies: the Rust standard library and Windows' own user32/kernel32.

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
